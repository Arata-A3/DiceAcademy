<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3b2f4a">
<title>ダイスアカデミー</title>
<meta name="description" content="勇者養成学校の教官になって、サイコロ札で暦を進めながら見習い勇者を育てる双六育成シミュレーション。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ダイスアカデミー">
<meta property="og:title" content="ダイスアカデミー">
<meta property="og:description" content="勇者養成学校の教官になって、サイコロ札で暦を進めながら見習い勇者を育てる双六育成シミュレーション。">
<meta property="og:url" content="https://arata-a3.github.io/DiceAcademy/">
<meta property="og:image" content="https://arata-a3.github.io/DiceAcademy/og-image.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary">
<script>try { const a = JSON.parse(localStorage.getItem('diceacademy_save') || '{}').appearance; if (a === 'light' || a === 'dark') document.documentElement.dataset.theme = a; } catch (e) { }</script>
<link rel="stylesheet" href="css/style.css?v=1.0">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>ダイスアカデミー</h1>
    <span id="date" class="date"></span>
    <span class="stat-chip" title="知名度"><span data-icon="star"></span><span id="fame"></span></span>
    <span class="stat-chip" title="所持金（ゴールド）"><span data-icon="coin"></span><span id="gold"></span></span>
    <span id="next" class="next"></span>
    <span class="top-btns">
      <button id="cal-btn" class="icon-btn" aria-label="月のカレンダー"><span data-icon="calendar"></span><span class="btn-text">カレンダー</span></button>
      <button id="hist-btn" class="icon-btn" aria-label="学園の歴史"><span data-icon="book"></span><span class="btn-text">歴史</span></button>
      <button id="set-btn" class="icon-btn" aria-label="設定"><span data-icon="gear"></span></button>
    </span>
  </header>

  <section class="board">
    <div id="strip" class="strip"></div>
    <div id="branch" class="branch" hidden></div>
    <div id="questbar" class="questbar" hidden></div>
  </section>

  <p id="message" class="message" aria-live="polite"></p>

  <section id="students" class="students"></section>

  <footer id="handbar" class="handbar">
    <div class="hand-row">
      <span id="handLabel" class="hand-label"></span>
      <div id="hand" class="hand"></div>
      <div id="specials" class="hand specials"></div>
    </div>
    <div class="go-row">
      <span id="goInfo" class="go-info"></span>
      <button id="go" class="btn primary go" disabled></button>
    </div>
    <button id="version" class="version" aria-label="変更の記録"></button>
  </footer>
</div>

<section id="battle" class="battle" hidden>
  <div class="b-top"><span id="b-title" class="b-title"></span>
    <span class="b-speeds"><button class="btn spd" data-spd="normal">ふつう</button><button class="btn spd" data-spd="fast">早送り</button><button class="btn spd" data-spd="skip">結果だけ</button></span></div>
  <div class="b-order-row"><span class="b-order-l">次に動く順</span><div id="b-order" class="b-order"></div></div>
  <div class="b-field"><div id="b-allies" class="b-side"></div><div id="b-enemies" class="b-side foes"></div></div>
  <div id="b-log" class="b-log" aria-live="polite"></div>
  <div id="b-trump" class="b-trump"></div>
  <div id="b-result" class="b-result" hidden></div>
</section>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <div id="dlgButtons" class="dlg-buttons"></div>
</dialog>
<div id="toast" class="toast" role="status"></div>

<script src="js/version.js?v=1.0"></script>
<script src="js/data.js?v=1.0"></script>
<script src="js/battle.js?v=1.0"></script>
<script src="js/app.js?v=1.0"></script>
</body>
</html>
